# Dark, high-contrast defaults. Personal overrides belong in local.conf.
# The font family follows your system's monospace setting.

font_size 10.5

background #000000
foreground #ffffff

# ANSI colors also serve as backgrounds and selection text in applications.
# Keep blue dark for light text, and black readable on light backgrounds.
color0 #000000
color1 #ff6b6b
color2 #a8e16b
color3 #ffd866
color4 #2458a6
color5 #c792ea
color6 #89ddff
color7 #e6e6e6

color8 #a0a0a0
color9 #ff8f8f
color10 #c3f584
color11 #ffe699
color12 #a6c8ff
color13 #e0b3ff
color14 #b3f4ff
color15 #ffffff

# Attach an unoccupied tmux session or create an independent one.
shell sh -c 'case ${XDG_CONFIG_HOME-} in /*) config_home=$XDG_CONFIG_HOME ;; *) config_home=$HOME/.config ;; esac; exec sh "$config_home/dalftui/bin/tmux-start.sh"'

# Shift+drag selects, Ctrl+Shift+C copies and Ctrl+Shift+V pastes, as in Windows Terminal.
# Selections are also copied automatically; Ctrl+Shift+C still works.
copy_on_select clipboard

# The SSH picker (Ctrl+B F2) opens tabs through this private socket.
# socket-only ignores remote control requests that programs, including SSH hosts, print.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# Tabs sit at the top on a strip the color of the Breeze Dark title bar,
# so title bar and tabs read as one surface. The active tab is cut from the
# terminal's black, like a browser tab opening onto its page.
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style separator
tab_separator " "
tab_bar_margin_width 0
tab_bar_margin_height 2 0
tab_bar_background #272c31
tab_bar_margin_color #272c31
active_tab_background #000000
active_tab_foreground #fcfcfc
active_tab_font_style normal
inactive_tab_background #272c31
inactive_tab_foreground #a1a9b1
inactive_tab_font_style normal
tab_title_template "  {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title if len(title) <= max_title_length - 4 else title[:max(0, max_title_length - 5)] + '…'}  "
active_tab_title_template "{fmt.fg._000000}{fmt.bg.default}{fmt.fg.tab}{fmt.bg.tab} {title if len(title) <= max_title_length - 4 else title[:max(0, max_title_length - 5)] + '…'} {fmt.fg._000000}{fmt.bg.default}"
