# Dark, high-contrast defaults. Personal overrides belong in local.conf.
# The font family follows your system's monospace setting.

font_size 10.5
window_padding_width 4
cursor_blink_interval 0
mouse_hide_wait 1.0
enable_audio_bell no
# tmux keeps the session when a window or tab closes.
confirm_os_window_close 0

background #000000
foreground #ffffff

# ANSI colors also serve as backgrounds and selection text in applications.
# Keep blue dark for light text, and black readable on light backgrounds.
color0 #000000
color1 #ff6b6b
color2 #a8e16b
color3 #ffd866
color4 #2458a6
color5 #c792ea
color6 #89ddff
color7 #e6e6e6

color8 #a0a0a0
color9 #ff8f8f
color10 #c3f584
color11 #ffe699
color12 #a6c8ff
color13 #e0b3ff
color14 #b3f4ff
color15 #ffffff

# Attach an unoccupied tmux session or create an independent one.
shell sh -c 'case ${XDG_CONFIG_HOME-} in /*) config_home=$XDG_CONFIG_HOME ;; *) config_home=$HOME/.config ;; esac; exec sh "$config_home/dalftui/bin/tmux-start.sh"'

# Shift+drag selects, Ctrl+Shift+C copies and Ctrl+Shift+V pastes, as in Windows Terminal.
# Selections are also copied automatically; Ctrl+Shift+C still works.
copy_on_select clipboard
# tmux pads copied lines with spaces; drop them from plain-text selections.
strip_trailing_spaces smart
# Also confirm pastes larger than 16 KB.
paste_actions quote-urls-at-prompt,confirm,confirm-if-large

# tmux splits panes; pass Ctrl+Shift+Enter to the program instead of opening a kitty split.
map kitty_mod+enter

# Ctrl+Alt+1..8 go to that tab and Ctrl+Alt+9 to the last one, as in Windows Terminal;
# Ctrl+Alt+0 lists all tabs to pick from.
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 99
map ctrl+alt+0 select_tab
# ./install adds kitty-azerty.conf on AZERTY keyboards.

# The SSH picker (Ctrl+B F2) opens tabs through this private socket.
# socket-only ignores remote control requests that programs, including SSH hosts, print.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-{kitty_pid}

# Tabs sit at the top on a strip the color of the Breeze Dark title bar,
# so title bar and tabs read as one surface. The active tab is cut from the
# terminal's black, like a browser tab opening onto its page.
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style separator
tab_separator " "
tab_bar_margin_width 0
tab_bar_margin_height 2 0
tab_bar_background #272c31
tab_bar_margin_color #272c31
active_tab_background #000000
active_tab_foreground #fcfcfc
active_tab_font_style normal
inactive_tab_background #272c31
inactive_tab_foreground #a1a9b1
inactive_tab_font_style normal
tab_title_template "  {fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index} {title if len(title) <= max_title_length - 6 else title[:max(0, max_title_length - 7)] + '…'}  "
active_tab_title_template "{fmt.fg._000000}{fmt.bg.default}{fmt.fg.tab}{fmt.bg.tab} {index} {title if len(title) <= max_title_length - 6 else title[:max(0, max_title_length - 7)] + '…'} {fmt.fg._000000}{fmt.bg.default}"
