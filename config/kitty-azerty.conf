# Ctrl+Alt+1..9 and 0 without Shift on a French AZERTY keyboard. The kitty loader includes
# this file only on AZERTY, since on other layouts these are keys like Ctrl+Alt+-.
map ctrl+alt+& goto_tab 1
map ctrl+alt+é goto_tab 2
map ctrl+alt+" goto_tab 3
map ctrl+alt+' goto_tab 4
map ctrl+alt+( goto_tab 5
map ctrl+alt+- goto_tab 6
map ctrl+alt+è goto_tab 7
map ctrl+alt+_ goto_tab 8
map ctrl+alt+ç goto_tab 99
map ctrl+alt+à select_tab
