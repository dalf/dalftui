set -gF @dalftui_root '#{d:current_file}/..'

set -g mouse on
%if "#{>=:#{version},3.3}"
set -g allow-passthrough on
%endif
set -s extended-keys on
# Fixed array slots keep repeated reloads from appending duplicate entries.
set -s terminal-features[100] 'xterm*:extkeys'
# xterm-256color also names older Apple Terminal clients, including over SSH.
# Limit the override to Alacritty; tmux detects other capable clients separately.
set -s terminal-overrides[100] 'alacritty*:Tc'
set -g history-limit 100000
# Programs in panes, including over SSH, may set the desktop clipboard via OSC 52.
# They cannot read it, but an OSC 52 query returns tmux's latest paste buffer.
set -s set-clipboard on
set -s terminal-features[101] 'alacritty*:clipboard'

# Tabs at the top
set -g status-position top
set -g status-justify left
# Refresh Git context while programs run; tmux caches asynchronous #() results.
set -g status-interval 5

set -g status-left ""
set -g status-right ""
set -g status-left-length 0
set -g status-right-length 0

# Claude pane: repository@branch; shell pane: its title; programs: Git context + name.
# Quote both paths for /bin/sh; the helper only reads repository/ref metadata.
set -g @dalftui_program_label '#(python3 #{q:@dalftui_root}/bin/tmux_label.py #{q:pane_current_path}) · #{window_name}'
set -g @claude_window_label '#{?#{||:#{m/r: ct1 [wai] [0-9]+$,#{pane_title}},#{m/r: ct2 [pWA] [0-9]+$,#{pane_title}}},#{s| ct[12] [waipWA] [0-9]*$||:#{pane_title}},#{?#{m/r:^(ba|z|fi)?sh$,#{pane_current_command}},#{pane_title},#{E:@dalftui_program_label}}}'

# Catppuccin v2.3.1: Mocha for panes, messages and copy mode.
# The approved tab design uses a neutral light selected pill and dark other pills.
set -g @catppuccin_flavor mocha
set -g @catppuccin_status_background '#000000'
set -g @catppuccin_window_status_style none
source-file -F "#{d:current_file}/../vendor/catppuccin/catppuccin_options_tmux.conf"
source-file -F "#{d:current_file}/../vendor/catppuccin/catppuccin_tmux.conf"
# Catppuccin's surface_0 selection is nearly invisible on Windows Terminal's background.
set -g mode-style 'fg=#111827,bg=#e5e7eb'

# Recolor Claude's default status emoji as plain circles, inside each tab.
# The plugin still supplies every pane's live status, including expiry/background work.
# Selected: idle #424242, question #b86100, working #1565c0, workflow #8e24aa.
# Other tabs: idle #e0e0e0, question #ffab40, working #64b5f6, workflow #ce93d8.
set -g @claude_tab_inactive_strip '#{s|⚪|#[fg=#e0e0e0]⬤|:#{s|🟣|#[fg=#ce93d8]⬤|:#{s|🟠|#[fg=#ffab40]⬤|:#{s|🔵|#[fg=#64b5f6]⬤|:#{T:@cctab_window_strip}}}}}'
set -g @claude_tab_active_strip '#{s|⚪|#[fg=#424242]⬤|:#{s|🟣|#[fg=#8e24aa]⬤|:#{s|🟠|#[fg=#b86100]⬤|:#{s|🔵|#[fg=#1565c0]⬤|:#{T:@cctab_window_strip}}}}}'

# Explicit strip placement preserves the integration and prevents duplicate indicators.
# Labels use dark text on light (#e5e7eb) and light text on dark (#313244).
set -g window-status-format '#[none,fg=#313244,bg=#000000]#[none,fg=#cdd6f4,bg=#313244] #{?#{T:@cctab_window_strip},#{E:@claude_tab_inactive_strip} ,}#[none,fg=#cdd6f4,bg=#313244]#I:#{E:@claude_window_label} #[none,fg=#313244,bg=#000000]#[none,fg=#cdd6f4,bg=#000000]'
set -g window-status-current-format '#[none,fg=#e5e7eb,bg=#000000]#[none,fg=#111827,bg=#e5e7eb] #{?#{T:@cctab_window_strip},#{E:@claude_tab_active_strip} ,}#[bold,fg=#111827,bg=#e5e7eb]#I:#{E:@claude_window_label} #[none,fg=#e5e7eb,bg=#000000]#[none,fg=#cdd6f4,bg=#000000]'
set -g window-status-separator " "

# Open the active pane's directory in local VS Code, including picker SSH windows.
# q: quotes the checkout path and client tty for the shell, including special characters.
bind-key -N "Open current folder in VS Code" F3 run-shell -b 'python3 #{q:@dalftui_root}/bin/vscode.py --pane #{pane_id} --client #{client_pid} --client-tty #{q:client_tty}'

# Direct pane navigation and resizing from Alacritty.
bind-key -n C-M-Left select-pane -L
bind-key -n C-M-Right select-pane -R
bind-key -n C-M-Up select-pane -U
bind-key -n C-M-Down select-pane -D
bind-key -n C-M-S-Left resize-pane -L 5
bind-key -n C-M-S-Right resize-pane -R 5
bind-key -n C-M-S-Up resize-pane -U 5
bind-key -n C-M-S-Down resize-pane -D 5

# Selection is terminal-native everywhere: Shift+drag, then Ctrl+Shift+C / Ctrl+Shift+V.
# Mouse apps and history still receive drags and clicks; shells get a hint instead of copy mode.
bind-key -n MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'display-message "Hold Shift to select; Ctrl+Shift+C copies"'
bind-key -n DoubleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M'
bind-key -n TripleClick1Pane select-pane -t = \; if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M'
%if "#{==:#{@dalftui_profile},macos}"
# Terminal.app ignores OSC 52, so tmux copies reach the macOS clipboard through pbcopy.
set -s copy-command pbcopy
bind-key -n MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'display-message "Hold Fn (Terminal.app) or Option (iTerm2) to select; Cmd+C copies"'
# iTerm2 should send Ctrl+Shift+F1/F3 by default (untested); Terminal.app needs a key mapping.
bind-key -n C-S-F1 display-popup -E -d "#{@dalftui_root}" -w 90% -h 90% "python3 bin/shortcuts.py --tmux-only"
bind-key -n C-S-F3 run-shell -b 'python3 #{q:@dalftui_root}/bin/vscode.py --pane #{pane_id} --client #{client_pid} --client-tty #{q:client_tty}'
%else
set -s copy-command ''
unbind-key -q -n C-S-F1
unbind-key -q -n C-S-F3
%endif

# Keyboard scrollback and search.
# Ctrl+F searches literal text in history; press Enter to confirm and Esc to exit.
# Preserve Shift+Page Up for apps using the alternate screen.
bind-key -n S-PPage if-shell -F '#{alternate_on}' 'send-keys S-PPage' 'copy-mode -u'
bind-key -T copy-mode Up send-keys -X cursor-up
bind-key -T copy-mode Down send-keys -X cursor-down
bind-key -T copy-mode Left send-keys -X cursor-left
bind-key -T copy-mode Right send-keys -X cursor-right
bind-key -T copy-mode PPage send-keys -X page-up
bind-key -T copy-mode NPage send-keys -X page-down
bind-key -T copy-mode S-PPage send-keys -X page-up
bind-key -T copy-mode Escape send-keys -X cancel
bind-key -T copy-mode-vi Up send-keys -X cursor-up
bind-key -T copy-mode-vi Down send-keys -X cursor-down
bind-key -T copy-mode-vi Left send-keys -X cursor-left
bind-key -T copy-mode-vi Right send-keys -X cursor-right
bind-key -T copy-mode-vi PPage send-keys -X page-up
bind-key -T copy-mode-vi NPage send-keys -X page-down
bind-key -T copy-mode-vi S-PPage send-keys -X page-up
bind-key -T copy-mode-vi Escape send-keys -X cancel
%if "#{>=:#{version},3.3}"
bind-key -T copy-mode C-f command-prompt -T search -p 'Find in history:' 'send-keys -X search-backward-text "%%%"'
bind-key -T copy-mode-vi C-f command-prompt -T search -p 'Find in history:' 'send-keys -X search-backward-text "%%%"'
%else
# tmux 3.2 has a shared prompt history instead of a separate search history.
bind-key -T copy-mode C-f command-prompt -p 'Find in history:' 'send-keys -X search-backward-text "%%%"'
bind-key -T copy-mode-vi C-f command-prompt -p 'Find in history:' 'send-keys -X search-backward-text "%%%"'
%endif

# The private loader records the mode; older desktop loaders have no mode option.
%if "#{>=:#{version},3.3}"
%if "#{||:#{==:#{@dalftui_profile},tmux-only},#{==:#{@dalftui_profile},macos}}"
# Server guide uses tmux keys and does not read a server Alacritty configuration.
bind-key -N "Show tmux shortcuts" F1 display-popup -E -d "#{@dalftui_root}" -w 90% -h 90% -b rounded -s "fg=#e5e7eb,bg=#000000" -S "fg=#9399b2,bg=#000000" -T " Keyboard shortcuts " "python3 bin/shortcuts.py --tmux-only"
# Remove a previously installed desktop picker when switching modes.
unbind-key -q F2
%else
# Ctrl+B then F1: shortcut guide; Win+Shift+H also maps here in Alacritty.
bind-key -N "Show Alacritty and tmux shortcuts" F1 display-popup -E -d "#{@dalftui_root}" -w 90% -h 90% -b rounded -s "fg=#e5e7eb,bg=#000000" -S "fg=#9399b2,bg=#000000" -T " Keyboard shortcuts " "python3 bin/shortcuts.py"

# Ctrl+B then F2: choose a host, open a separate Alacritty window, and attach remote tmux.
bind-key -N "Choose SSH host in a new Alacritty window" F2 display-popup -E -d "#{@dalftui_root}" -w 100% -h 100% -b rounded -s "fg=#e5e7eb,bg=#000000" -S "fg=#9399b2,bg=#000000" -T " SSH hosts " "python3 bin/ssh_picker.py"
%endif
%else
# tmux 3.2 popups use the terminal's default colors and a plain border.
%if "#{||:#{==:#{@dalftui_profile},tmux-only},#{==:#{@dalftui_profile},macos}}"
bind-key -N "Show tmux shortcuts" F1 display-popup -E -d "#{@dalftui_root}" -w 90% -h 90% "python3 bin/shortcuts.py --tmux-only"
unbind-key -q F2
%else
bind-key -N "Show Alacritty and tmux shortcuts" F1 display-popup -E -d "#{@dalftui_root}" -w 90% -h 90% "python3 bin/shortcuts.py"
bind-key -N "Choose SSH host in a new Alacritty window" F2 display-popup -E -d "#{@dalftui_root}" -w 100% -h 100% "python3 bin/ssh_picker.py"
%endif
%endif
