# Dark, high-contrast defaults. Personal overrides belong in local.toml.
# The font family follows your system's monospace setting.

[font]
size = 10.5

[window]
opacity = 1.0

[colors.primary]
background = "#000000"
foreground = "#ffffff"

# ANSI colors also serve as backgrounds and selection text in applications.
# Keep blue dark for light text, and black readable on light backgrounds.
[colors.normal]
black = "#000000"
red = "#ff6b6b"
green = "#a8e16b"
yellow = "#ffd866"
blue = "#2458a6"
magenta = "#c792ea"
cyan = "#89ddff"
white = "#e6e6e6"

[colors.bright]
black = "#a0a0a0"
red = "#ff8f8f"
green = "#c3f584"
yellow = "#ffe699"
blue = "#a6c8ff"
magenta = "#e0b3ff"
cyan = "#b3f4ff"
white = "#ffffff"

# Attach an unoccupied tmux session or create an independent one.
[terminal.shell]
program = "sh"
args = ["-c", 'case ${XDG_CONFIG_HOME-} in /*) config_home=$XDG_CONFIG_HOME ;; *) config_home=$HOME/.config ;; esac; exec sh "$config_home/dalftui/bin/tmux-start.sh"']

# Shift+drag selects, Ctrl+Shift+C copies and Ctrl+Shift+V pastes, as in Windows Terminal.
# Selections are also copied automatically; Ctrl+Shift+C still works.
[selection]
save_to_clipboard = true
