min_version = "2026.7.5"

# Use existing Python and uv installations, including CI's Python version matrix.
[vars]
powershell = "{{ env.DALFTUI_POWERSHELL | default(value='powershell') }}"
# Windows cannot infer these Unix-only APIs in platform-guarded code and tests.
# Match exact qualified names; Linux lint checks them without exemptions.
windows_lint_members = 'socket[.]AF_UNIX\Z,os[.]fchmod\Z,os[.]getuid\Z,os[.]killpg\Z,os[.]openpty\Z,signal[.]SIGHUP\Z,signal[.]SIGKILL\Z,curses[.]use_default_colors\Z,curses[.]init_pair\Z,curses[.]set_escdelay\Z,curses[.]error\Z,curses[.]color_pair\Z,ssh_picker[.]curses[.]error\Z'

[tasks.check]
description = "Run spelling, Pylint, then all tests for the current platform"
alias = "default"
depends = ["spellcheck"]
run = [{ task = "pylint" }, { task = "test" }]

[tasks.spellcheck]
description = "Check spelling with the pinned codespell version"
run = "uvx codespell==2.4.3"

[tasks.pylint]
description = "Check Python source, entrypoints, and tests with Pylint"
alias = "lint"
run = "uvx --python python3 pylint==4.1.2 --rcfile=.pylintrc dalftui tests bridge_protocol.py install bin/reload bin/shortcuts.py bin/ssh_picker.py bin/vscode.py bin/terminal_settings.py"
run_windows = 'uvx --python python pylint==4.1.2 --rcfile=.pylintrc --generated-members={{ vars.windows_lint_members }} dalftui tests bridge_protocol.py install bin/reload bin/shortcuts.py bin/ssh_picker.py bin/vscode.py bin/terminal_settings.py'

[tasks.test]
description = "Run all tests for the current platform"
run = [{ task = "test:linux" }]
run_windows = [{ task = "test:windows" }, { task = "test:powershell" }]

[tasks."test:linux"]
description = "Run full Python discovery, including Linux integration tests"
raw_args = true
run = "python3 -m unittest discover -s tests -v"

[tasks."test:windows"]
description = "Run Windows launcher/Terminal and shared bridge Python suites"
run = [
    'python -m unittest discover -s tests -p "test_windows*.py" -v',
    { task = "test:bridge" },
]

[tasks."test:bridge"]
description = "Run shared bridge lifecycle and historical compatibility tests"
raw_args = true
run = 'python3 -m unittest discover -s tests -p "test_bridge*.py" -v'
run_windows = 'python -m unittest discover -s tests -p "test_bridge*.py" -v'

[tasks."test:powershell"]
description = "Verify Windows setup and profile integration in PowerShell"
# Rebuild module paths for the selected shell, including 5.1 launched from pwsh.
env = { PSModulePath = "" }
run = "{{ vars.powershell }} -NoProfile -File ./tests/test_windows_setup.ps1"

[tasks."install:linux"]
description = "Install Linux configuration (accepts --dry-run and --tmux-only)"
raw_args = true
run = "./install"

[tasks."install:windows"]
description = "Set up PowerShell profiles, the native SSH picker, and Terminal integration"
raw_args = true
env = { PSModulePath = "" }
run = "{{ vars.powershell }} -NoProfile -ExecutionPolicy Bypass -File ./install.ps1"

[tasks."uninstall:linux"]
description = "Remove the Linux configuration that install added (accepts --dry-run)"
raw_args = true
run = "./install --uninstall"

[tasks."uninstall:windows"]
description = "Remove the PowerShell profile block and Terminal/VS Code entries that setup added (accepts -DryRun)"
raw_args = true
env = { PSModulePath = "" }
run = "{{ vars.powershell }} -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -Uninstall"

[tasks."reload:linux"]
description = "Reload Linux configuration (accepts --socket PATH)"
raw_args = true
run = "./bin/reload"

[tasks."ssh:list"]
description = "List SSH picker hosts without opening a connection"
raw_args = true
run = "python3 bin/ssh_picker.py --list"
run_windows = "python bin/ssh_picker.py --list"
