name: Linux tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: jdx/mise-action@v4
        with:
          version: '2026.7.5'
          install: false
          cache: false
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes fzf git less openssh-client tmux
      - name: Check spelling
        run: mise run spellcheck
      - name: Verify Linux and shared functionality
        run: mise run test:linux
