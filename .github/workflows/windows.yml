name: Windows launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        shell: [powershell, pwsh]
    env:
      DALFTUI_POWERSHELL: ${{ matrix.shell }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: jdx/mise-action@v4
        with:
          version: '2026.7.5'
          install: false
          cache: false
      - name: Check spelling
        run: mise run spellcheck
      - name: Check Python with Pylint
        run: mise run pylint
      - name: Verify setup and PowerShell profile integration
        run: mise run test:powershell
      - name: Set up the real fzf package in an isolated profile
        run: mise run install:windows -- -PackageManager choco -ProfilePath "$env:RUNNER_TEMP\dalftui-profile.ps1" -SkipTerminal
      - name: Verify Windows launcher, Terminal settings, and shared bridge suites
        run: |
          # Package setup refreshes only its process; refresh this step's PATH too.
          $env:PATH += ';' + [Environment]::GetEnvironmentVariable('PATH', 'User') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          mise run test:windows
