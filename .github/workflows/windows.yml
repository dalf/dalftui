name: Windows launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Check spelling
        run: uvx codespell==2.4.3
      - name: Verify setup and PowerShell profile integration
        run: .\tests\test_windows_setup.ps1
      - name: Set up the real fzf package in an isolated profile
        run: .\setup-windows.ps1 -PackageManager choco -ProfilePath "$env:RUNNER_TEMP\dalftui-profile.ps1" -SkipTerminal
      - name: Verify Windows SSH, editor launcher, and Terminal settings
        run: |
          # Package setup refreshes only its process; refresh this step's PATH too.
          $env:PATH += ';' + [Environment]::GetEnvironmentVariable('PATH', 'User') + ';' + [Environment]::GetEnvironmentVariable('PATH', 'Machine')
          python -m unittest discover -s tests -p 'test_windows*.py' -v
      - name: Verify editor bridge lifecycle and historical protocol compatibility
        run: python -m unittest discover -s tests -p 'test_bridge*.py' -v
