name: Windows launcher

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        shell: [powershell, pwsh]
    env:
      DALFTUI_POWERSHELL: ${{ matrix.shell }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: jdx/mise-action@v4
        with:
          version: '2026.7.5'
          install: false
          cache: false
      - name: Check spelling
        run: mise run spellcheck
      - name: Check Python with Pylint
        run: mise run pylint
      - name: Verify setup and PowerShell profile integration
        run: mise run test:powershell
      - name: Install Oh My Posh with Scoop, as the bootstrap does
        # Scoop's package is the standalone program; Chocolatey's installs a self-updating Windows app.
        # The runner is elevated, which Scoop accepts only with -RunAsAdmin.
        run: |
          iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
          scoop install oh-my-posh
          Add-Content -Path $env:GITHUB_PATH -Value "$HOME\scoop\shims"
      - name: Pre-register Hack Nerd Font
        # A registered font makes setup skip oh-my-posh's download, which hits shared GitHub API rate limits.
        run: |
          $fonts = 'HKCU:\Software\Microsoft\Windows NT\CurrentVersion\Fonts'
          if (-not (Test-Path $fonts)) { $null = New-Item -Path $fonts }
          $null = New-ItemProperty -Path $fonts -Name 'Hack Nerd Font Regular (TrueType)' -Value 'HackNerdFont-Regular.ttf' -Force
      - name: Verify installation in an isolated profile
        timeout-minutes: 3  # Usually seconds; a hang should fail fast, not use the whole job.
        run: mise run install:windows -- -ProfilePath "$env:RUNNER_TEMP\dalftui-profile.ps1" -SkipTerminal
      - name: Verify Windows launcher, Terminal settings, and shared bridge suites
        run: mise run test:windows
